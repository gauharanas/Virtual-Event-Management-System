<div class="container mt-5">

  <div class="row justify-content-center">

    <div class="col-md-5">

      <div class="card shadow p-4">

        <h2 class="text-center mb-4">

          Register

        </h2>

        <div
          *ngIf="successMessage"
          class="alert alert-success">

          {{ successMessage }}

        </div>

        <form
          [formGroup]="registerForm"
          (ngSubmit)="onSubmit()">

          <div class="mb-3">

            <label>Name</label>

            <input
              type="text"
              class="form-control"
              formControlName="userName">

          </div>

          <div class="mb-3">

            <label>Email</label>

            <input
              type="email"
              class="form-control"
              formControlName="emailId">

          </div>

          <div class="mb-3">

            <label>Password</label>

            <input
              type="password"
              class="form-control"
              formControlName="password">

          </div>

          <button
            class="btn btn-success w-100">

            Register

          </button>

        </form>

      </div>

    </div>

  </div>

</div>
