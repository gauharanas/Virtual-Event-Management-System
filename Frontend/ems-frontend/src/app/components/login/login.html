<div class="container mt-5">

  <div class="row justify-content-center">

    <div class="col-md-5">

      <div class="card shadow p-4">

        <h2 class="text-center mb-4">

          Login

        </h2>

        <div
          *ngIf="errorMessage"
          class="alert alert-danger">

          {{ errorMessage }}

        </div>

        <form
          [formGroup]="loginForm"
          (ngSubmit)="onSubmit()">

          <div class="mb-3">

            <label class="form-label">

              Email

            </label>

            <input
              type="email"
              class="form-control"
              formControlName="emailId">

          </div>

          <div class="mb-3">

            <label class="form-label">

              Password

            </label>

            <input
              type="password"
              class="form-control"
              formControlName="password">

          </div>

          <button
            class="btn btn-primary w-100">

            Login

          </button>

        </form>

      </div>

    </div>

  </div>

</div>
